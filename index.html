<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MD India — Insurance AI Assistant</title>
  <meta name="description"
    content="Enterprise AI assistant for querying hospital tariff cards and insurance data across multiple insurance companies." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ═══════════════════════════════════════════════════════
       SIDEBAR
  ═══════════════════════════════════════════════════════ -->
  <aside class="sidebar" id="sidebar">

    <!-- Brand -->
    <div class="sidebar-brand">
      <div class="brand-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
      </div>
      <span class="brand-name">MD India AI</span>
      <button class="sidebar-toggle-btn" id="sidebarToggle" title="Toggle sidebar" aria-label="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12h18M3 6h18M3 18h18" />
        </svg>
      </button>
    </div>

    <!-- New Chat -->
    <button class="new-chat-btn" id="newChatBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      New Chat
    </button>

    <!-- Search -->
    <div class="sidebar-search">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input type="text" id="searchInput" placeholder="Search conversations..." />
    </div>

    <!-- History -->
    <div class="history-container" id="historyContainer">
      <div class="history-empty" id="historyEmpty">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
        <p>No conversations yet</p>
      </div>
      <div id="historyList"></div>
    </div>

    <!-- Sidebar Footer -->
    <div class="sidebar-footer">
      <div class="api-status" id="apiStatus">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Connecting...</span>
      </div>
    </div>
  </aside>

  <!-- ═══════════════════════════════════════════════════════
       MAIN AREA
  ═══════════════════════════════════════════════════════ -->
  <main class="main" id="main">

    <!-- Top Bar -->
    <header class="topbar">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round">
          <path d="M3 12h18M3 6h18M3 18h18" />
        </svg>
      </button>
      <div class="model-badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
        </svg>
        Gemini 2.5 Pro
      </div>
    </header>

    <!-- Messages Area -->
    <div class="messages-area" id="messagesArea">

      <!-- Welcome Screen (shown when no messages) -->
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-logo">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <h1 class="welcome-title">MD India Insurance AI</h1>
        <p class="welcome-subtitle">Your intelligent assistant for hospital tariff cards & insurance queries</p>
        <div class="suggestion-grid">
          <button class="suggestion-card" data-prompt="List all insurance companies available in the database">
            <span class="suggestion-icon">🏢</span>
            <span>List all insurance companies</span>
          </button>
          <button class="suggestion-card" data-prompt="How many hospitals are in Niva Bupa's network?">
            <span class="suggestion-icon">🏥</span>
            <span>How many hospitals in Niva Bupa?</span>
          </button>
          <button class="suggestion-card" data-prompt="What are the ICU charges per day across different hospitals?">
            <span class="suggestion-icon">💊</span>
            <span>Compare ICU charges across hospitals</span>
          </button>
          <button class="suggestion-card" data-prompt="Which states are covered by Tata AIG insurance?">
            <span class="suggestion-icon">🗺️</span>
            <span>States covered by Tata AIG</span>
          </button>
        </div>
      </div>

      <!-- Chat messages injected here by JS -->
      <div id="chatMessages"></div>

    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-wrapper" id="inputWrapper">
        <textarea id="messageInput" placeholder="Ask anything about hospital tariffs, insurance coverage, costs..."
          rows="1" maxlength="4000" aria-label="Message input"></textarea>
        <button class="send-btn" id="sendBtn" disabled aria-label="Send message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13" />
            <polygon points="22 2 15 22 11 13 2 9 22 2" />
          </svg>
        </button>
      </div>
      <p class="input-hint">MD India AI can make mistakes. Always verify tariff information with official sources.</p>
    </div>

  </main>

  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <script src="app.js"></script>
</body>

</html>
